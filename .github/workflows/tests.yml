name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: End to end (offline)
        run: |
          lumilog generate --out logs/sms-gateway.log
          lumilog analyze logs/sms-gateway.log --offline --out incident-report.md
          grep -q "Submit failures at provider ISAT" incident-report.md
